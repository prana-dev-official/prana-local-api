[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prana-api-client"
version = "0.13.0"
description = "Async client for the local HTTP API of Prana heat recovery ventilators."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prana Developer", email = "devprana18@gmail.com" }]
keywords = ["prana", "ventilator", "recuperator", "api", "async", "home-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Home Automation",
    "Typing :: Typed",
]
dependencies = ["aiohttp>=3.9.0"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.17.6",
    "twine>=5.1",
]

[project.scripts]
prana-simulator = "prana_local_api_client.simulator:main"

[project.urls]
Homepage = "https://github.com/prana-dev-official/prana-local-api"
Issues = "https://github.com/prana-dev-official/prana-local-api/issues"
Changelog = "https://github.com/prana-dev-official/prana-local-api/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["prana_local_api_client*"]

[tool.setuptools.package-data]
prana_local_api_client = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["prana_local_api_client"]
branch = true

[tool.coverage.report]
fail_under = 90
show_missing = true
exclude_also = ["if __name__ == .__main__.:"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "N",        # naming
    "D",        # docstrings
    "PT",       # pytest style
    "ASYNC",    # async pitfalls
    "RUF",
]
ignore = [
    "D203", "D213", "D105", "D107",
    "N818",  # public exception names predate the Error-suffix convention
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["prana_local_api_client"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["prana_local_api_client"]
